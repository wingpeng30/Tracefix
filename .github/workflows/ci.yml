name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装项目与测试依赖
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        run: python -m pip install -e ".[dev,llm,docker]"

      - name: 运行测试与覆盖率检查
        run: python -m pytest --cov=tracefix --cov-report=term-missing

      - name: 运行 Ruff 静态检查
        run: python -m ruff check .

      - name: 检查 Python 文件可编译性
        run: python -m compileall -q src tests

  docker-zero-call:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建隔离的零模型调用镜像
        run: docker build --pull=false -f docker/zero-call-smoke.Dockerfile -t tracefix-zero-call-smoke:${{ github.sha }} .

      - name: 运行 baseline 和 Skills 合成闭环
        run: |
          mkdir -p "$RUNNER_TEMP/tracefix-smoke"
          docker run --network none --rm \
            --mount "type=bind,source=$RUNNER_TEMP/tracefix-smoke,target=/output" \
            tracefix-zero-call-smoke:${{ github.sha }} --output /output/baseline
          docker run --network none --rm \
            --mount "type=bind,source=$RUNNER_TEMP/tracefix-smoke,target=/output" \
            tracefix-zero-call-smoke:${{ github.sha }} --skills-enabled --output /output/skills

      - name: 保存 smoke 摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-zero-call-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/tracefix-smoke
          if-no-files-found: warn
