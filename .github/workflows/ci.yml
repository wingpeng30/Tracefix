name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            lock-file: requirements/locks/engineering-py311.txt
          - python-version: "3.12"
            lock-file: requirements/locks/engineering-py312.txt

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装项目与测试依赖
        run: |
          python -m pip install --require-hashes -r requirements/locks/build-tools.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r ${{ matrix.lock-file }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 运行统一工程检查并保存原始结果
        env:
          TRACEFIX_EVENT_BEFORE: ${{ github.event.before }}
          TRACEFIX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: pwsh
        run: |
          switch ($env:GITHUB_EVENT_NAME) {
            "pull_request" { $diffBase = "origin/$env:GITHUB_BASE_REF" }
            "push" {
              if ($env:TRACEFIX_EVENT_BEFORE -match '^0+$') { $diffBase = "HEAD^" }
              else { $diffBase = $env:TRACEFIX_EVENT_BEFORE }
            }
            "workflow_dispatch" { $diffBase = "origin/$env:TRACEFIX_DEFAULT_BRANCH" }
            default { throw "Unsupported event for diff check: $env:GITHUB_EVENT_NAME" }
          }
          python scripts/check_engineering.py --output "$env:RUNNER_TEMP/tracefix-engineering" --python python --diff-base $diffBase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 从 checkout 执行 editable 零调用 smoke
        if: always()
        shell: pwsh
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $smokeRoot = Join-Path $env:RUNNER_TEMP "tracefix-editable-smoke"
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Push-Location $env:RUNNER_TEMP
          try {
            python -m tracefix.reproduction --backend local --output (Join-Path $smokeRoot "baseline")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m tracefix.reproduction --backend local --skills-enabled --output (Join-Path $smokeRoot "skills")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m tracefix.reproduction --scenario pagination --backend local --output (Join-Path $smokeRoot "pagination-baseline")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m tracefix.reproduction --scenario pagination --backend local --skills-enabled --output (Join-Path $smokeRoot "pagination-skills")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: 构建并独立安装 wheel
        if: always()
        shell: pwsh
        run: |
          $wheelRoot = Join-Path $env:RUNNER_TEMP "tracefix-wheel"
          $wheelSmoke = Join-Path $env:RUNNER_TEMP "tracefix-wheel-smoke"
          $wheelEnv = Join-Path $env:RUNNER_TEMP "tracefix-wheel-env"
          New-Item -ItemType Directory -Path $wheelRoot -Force | Out-Null
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir $wheelRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem -LiteralPath $wheelRoot -Filter "*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "wheel build produced no wheel" }
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); n=set(z.namelist()); assert 'tracefix/reproduction.py' in n; assert 'tracefix/agent_bridge.py' in n; assert any(p.startswith('tracefix/skills/') and p.endswith('/SKILL.md') for p in n)" $wheel
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert 'tracefix/report.py' in set(z.namelist())" $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv $wheelEnv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelPython = Join-Path $wheelEnv "Scripts/python.exe"
          & $wheelPython -m pip install --require-hashes -r requirements/locks/build-tools.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -m pip install --require-hashes -r ${{ matrix.lock-file }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Push-Location $env:RUNNER_TEMP
          try {
            & $wheelPython -c "import pathlib,tracefix; p=pathlib.Path(tracefix.__file__).resolve(); assert 'site-packages' in str(p).lower(), p; print(p)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix-reproduce.exe") --backend local --output (Join-Path $wheelSmoke "baseline")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix-reproduce.exe") --backend local --skills-enabled --output (Join-Path $wheelSmoke "skills")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix-reproduce.exe") --scenario pagination --output (Join-Path $wheelSmoke "pagination-baseline")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix-reproduce.exe") --scenario pagination --skills-enabled --output (Join-Path $wheelSmoke "pagination-skills")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $ordinary = Join-Path $wheelSmoke "ordinary"
            & (Join-Path $wheelEnv "Scripts/tracefix-reproduce.exe") --scenario regression-feedback --output (Join-Path $wheelSmoke "regression feedback")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $wheelPython (Join-Path $env:GITHUB_WORKSPACE "examples/replay_ordinary.py") --output $ordinary
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix.exe") doctor --repo (Join-Path $ordinary "source") --test-python $wheelPython --test-target tests/test_widget.py --source-import widget --model offline/replay --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix.exe") doctor --prepare --repo (Join-Path $ordinary "source") --test-python $wheelPython --test-target tests/test_widget.py --source-import widget --model offline/replay --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $ordinaryRun = (Get-ChildItem -LiteralPath (Join-Path $ordinary "runs") -Directory | Select-Object -First 1).FullName
            & (Join-Path $wheelEnv "Scripts/tracefix.exe") verify --run $ordinaryRun
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & (Join-Path $wheelEnv "Scripts/tracefix.exe") export --run $ordinaryRun --output (Join-Path $ordinary "export.patch")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $wheelPython (Join-Path $env:GITHUB_WORKSPACE "examples/replay_resume.py") --output (Join-Path $wheelSmoke "recovery")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: 保存工程与 wheel 验证结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tracefix-engineering/summary.json
            ${{ runner.temp }}/tracefix-engineering/*.log
            ${{ runner.temp }}/tracefix-engineering/pytest.junit.xml
            ${{ runner.temp }}/tracefix-engineering/coverage.json
            ${{ runner.temp }}/tracefix-engineering/coverage.xml
            ${{ runner.temp }}/tracefix-engineering/coverage-gaps.json
            ${{ runner.temp }}/tracefix-editable-smoke/**/*.json
            ${{ runner.temp }}/tracefix-editable-smoke/**/*.jsonl
            ${{ runner.temp }}/tracefix-editable-smoke/**/*.diff
            ${{ runner.temp }}/tracefix-editable-smoke/**/*.html
            ${{ runner.temp }}/tracefix-wheel/*.whl
            ${{ runner.temp }}/tracefix-wheel-smoke/**/*.json
            ${{ runner.temp }}/tracefix-wheel-smoke/**/*.jsonl
            ${{ runner.temp }}/tracefix-wheel-smoke/**/*.diff
            ${{ runner.temp }}/tracefix-wheel-smoke/**/*.html
            ${{ runner.temp }}/tracefix-wheel-smoke/**/*.patch
            ${{ runner.temp }}/tracefix-wheel-smoke/**/*.sha256
          if-no-files-found: warn

  docker-zero-call:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Linux Python 与宿主 Runner 依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 TraceFix 宿主 Runner
        run: |
          python -m pip install --require-hashes -r requirements/locks/build-tools.txt
          python -m pip install --require-hashes -r requirements/locks/engineering-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: 构建隔离的合成任务镜像
        run: |
          docker build --pull=true -f docker/zero-call-smoke.Dockerfile -t tracefix-zero-call-smoke:${{ github.sha }} .
          docker image inspect --format '{{.Id}}' tracefix-zero-call-smoke:${{ github.sha }} > "$RUNNER_TEMP/tracefix-image-id.txt"

      - name: 运行 baseline 和 Skills 合成闭环
        run: |
          mkdir -p "$RUNNER_TEMP/tracefix-smoke"
          image_id="$(cat "$RUNNER_TEMP/tracefix-image-id.txt")"
          python -m tracefix.reproduction --backend docker --image-id "$image_id" --output "$RUNNER_TEMP/tracefix-smoke/baseline"
          python -m tracefix.reproduction --backend docker --image-id "$image_id" --skills-enabled --output "$RUNNER_TEMP/tracefix-smoke/skills"
          python -m tracefix.reproduction --backend docker --image-id "$image_id" --scenario pagination --output "$RUNNER_TEMP/tracefix-pagination/baseline"
          python -m tracefix.reproduction --backend docker --image-id "$image_id" --scenario pagination --skills-enabled --output "$RUNNER_TEMP/tracefix-pagination/skills"

      - name: 核对容器隔离、供应商零调用与清理
        if: always()
        run: |
          image_id="$(cat "$RUNNER_TEMP/tracefix-image-id.txt")"
          python scripts/audit_docker_smoke.py --root "$RUNNER_TEMP/tracefix-smoke" --image-id "$image_id" --output "$RUNNER_TEMP/tracefix-smoke/docker-audit.json"
          python scripts/audit_docker_smoke.py --root "$RUNNER_TEMP/tracefix-pagination" --scenario pagination --image-id "$image_id" --output "$RUNNER_TEMP/tracefix-pagination/docker-audit.json"
          test -f "$RUNNER_TEMP/tracefix-pagination/baseline/report.html"
          test -f "$RUNNER_TEMP/tracefix-pagination/skills/report.html"

      - name: 保存 smoke 摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-zero-call-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tracefix-image-id.txt
            ${{ runner.temp }}/tracefix-smoke/*/reproduction.json
            ${{ runner.temp }}/tracefix-smoke/*/runs/*/result.json
            ${{ runner.temp }}/tracefix-smoke/*/runs/*/trajectory.jsonl
            ${{ runner.temp }}/tracefix-smoke/*/runs/*/patch.diff
            ${{ runner.temp }}/tracefix-smoke/docker-audit.json
            ${{ runner.temp }}/tracefix-pagination/*/reproduction.json
            ${{ runner.temp }}/tracefix-pagination/*/report.html
            ${{ runner.temp }}/tracefix-pagination/*/runs/*/result.json
            ${{ runner.temp }}/tracefix-pagination/*/runs/*/trajectory.jsonl
            ${{ runner.temp }}/tracefix-pagination/*/runs/*/patch.diff
            ${{ runner.temp }}/tracefix-pagination/*/runs/*/test-evidence/*.json
            ${{ runner.temp }}/tracefix-pagination/docker-audit.json
          if-no-files-found: warn

  mcp-serena-zero-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned optional MCP host dependencies
        run: |
          python -m pip install --require-hashes -r requirements/locks/build-tools.txt
          python -m pip install --require-hashes -r requirements/locks/mcp-py311.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build isolated Serena image and record immutable ID
        run: |
          docker build --pull=true -f docker/serena-mcp.Dockerfile -t tracefix-serena-mcp:${{ github.sha }} .
          docker image inspect --format '{{.Id}}' tracefix-serena-mcp:${{ github.sha }} > "$RUNNER_TEMP/tracefix-serena-image-id.txt"
      - name: Replay a full Agent repair with real MCP symbol queries
        run: |
          set -euo pipefail
          image_id="$(cat "$RUNNER_TEMP/tracefix-serena-image-id.txt")"
          python examples/replay_ordinary.py --output "$RUNNER_TEMP/tracefix-mcp-replay" --mcp-serena-image-id "$image_id" | tee "$RUNNER_TEMP/tracefix-mcp-summary.json"
          test -z "$(docker ps -a --filter 'name=tracefix-mcp-' --format '{{.ID}}')"
      - name: Preserve MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-serena-zero-call-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tracefix-serena-image-id.txt
            ${{ runner.temp }}/tracefix-mcp-summary.json
            ${{ runner.temp }}/tracefix-mcp-replay/runs/*/result.json
            ${{ runner.temp }}/tracefix-mcp-replay/runs/*/trajectory.jsonl
            ${{ runner.temp }}/tracefix-mcp-replay/runs/*/patch.diff
          if-no-files-found: warn

  docker-ordinary-zero-call:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned host and wheel dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/locks/build-tools.txt
          python -m pip install --require-hashes -r requirements/locks/engineering-py311.txt
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/wheel"
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('$RUNNER_TEMP/wheel/*.whl')[0]); assert {'tracefix/docker/ordinary.Dockerfile','tracefix/docker/ordinary-base.lock'} <= set(z.namelist())"
          python -m pip install --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Build ordinary task image and replay twice
        run: |
          set -euo pipefail
          tracefix docker-prepare --output "$RUNNER_TEMP/ordinary-image.json"
          image_id="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/ordinary-image.json"))["image_id"])')"
          python examples/replay_ordinary.py --output "$RUNNER_TEMP/ordinary-one" --docker-ordinary-image-id "$image_id" | tee "$RUNNER_TEMP/ordinary-one-summary.json"
          python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text()+"\nexecution_backend = \"docker\"\ndocker_profile = \"ordinary\"\ndocker_image_id = \""+sys.argv[2]+"\"\n")' "$RUNNER_TEMP/ordinary-one/config.toml" "$image_id"
          tracefix doctor --config "$RUNNER_TEMP/ordinary-one/config.toml" --prepare --json | tee "$RUNNER_TEMP/ordinary-doctor.json"
          python examples/replay_ordinary.py --output "$RUNNER_TEMP/ordinary-two" --docker-ordinary-image-id "$image_id" | tee "$RUNNER_TEMP/ordinary-two-summary.json"
          first_run="$(find "$RUNNER_TEMP/ordinary-one/runs" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          tracefix verify --run "$first_run" | tee "$RUNNER_TEMP/ordinary-verification.json"
          tracefix report --run "$first_run"
          tracefix export --run "$first_run" --output "$RUNNER_TEMP/ordinary-export.patch"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["passed"] and d["image_id"].startswith("sha256:")' "$RUNNER_TEMP/ordinary-verification.json"
          python scripts/test_ordinary_docker_failures.py --image-id "$image_id" --output "$RUNNER_TEMP/ordinary-failures"
          test -z "$(docker ps -a --filter 'name=tracefix-' --format '{{.ID}}')"
      - name: Preserve ordinary Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ordinary-zero-call-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ordinary-image.json
            ${{ runner.temp }}/ordinary-image.build.log
            ${{ runner.temp }}/ordinary-*summary.json
            ${{ runner.temp }}/ordinary-verification.json
            ${{ runner.temp }}/ordinary-doctor.json
            ${{ runner.temp }}/ordinary-failures/failure-audit.json
            ${{ runner.temp }}/ordinary-failures/ordinary-timeout-disconnect/tool-events.jsonl
            ${{ runner.temp }}/ordinary-failures/ordinary-import-error/docker-run-state.json
            ${{ runner.temp }}/ordinary-export.patch
            ${{ runner.temp }}/ordinary-one/runs/*/result.json
            ${{ runner.temp }}/ordinary-one/runs/*/session.json
            ${{ runner.temp }}/ordinary-one/runs/*/trajectory.jsonl
            ${{ runner.temp }}/ordinary-one/runs/*/patch.diff
            ${{ runner.temp }}/ordinary-one/runs/*/report.html
            ${{ runner.temp }}/ordinary-one/runs/*/independent-validation.json
            ${{ runner.temp }}/ordinary-one/runs/*/docker-run-state.json
            ${{ runner.temp }}/ordinary-two/runs/*/result.json
            ${{ runner.temp }}/ordinary-two/runs/*/trajectory.jsonl
            ${{ runner.temp }}/ordinary-two/runs/*/patch.diff
          if-no-files-found: warn
