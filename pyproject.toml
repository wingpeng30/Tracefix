[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix-agent"
version = "0.4.0"
description = "图检索驱动、测试闭环的 Coding Agent 核心框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TraceFix Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
llm = [
    # 固定为当前实际验证过的版本，避免不同机器解析到行为差异较大的新版本。
    "litellm==1.75.5.post2",
    "python-dotenv>=1.0,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
tracefix = "tracefix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracefix*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["tracefix"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
