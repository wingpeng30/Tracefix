[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix-agent"
version = "0.8.4"
description = "图检索驱动、测试闭环的 Coding Agent 核心框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TraceFix Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
llm = [
    # 固定为当前实际验证过的版本，避免不同机器解析到行为差异较大的新版本。
    "litellm==1.75.5.post2",
    "python-dotenv>=1.0,<2",
]
benchmark = [
    # 仅候选获取阶段需要；安装时可指定清华镜像源。
    "datasets>=2.19,<4",
]
docker = ["cryptography==48.0.0"]
mcp = ["mcp==1.28.1"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.setuptools.package-data]
tracefix = [
    "skills/*/SKILL.md", "skills/*/references/*.md",
    "docker/ordinary.Dockerfile", "docker/ordinary-base.lock",
]

[project.scripts]
tracefix = "tracefix.cli:main"
tracefix-reproduce = "tracefix.reproduction:main"
tracefix-compare = "tracefix.comparison_campaign:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracefix*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["tracefix"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".test-tmp-*", "pytest-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
