[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefix-agent"
version = "0.0.1"
description = "图检索驱动、测试闭环的 Coding Agent 核心框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TraceFix Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
llm = [
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracefix*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["tracefix"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


